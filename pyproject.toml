[tool.uv.workspace]
members = [
    "apps/gateway",
    "apps/llm-gateway",
    "apps/notes-svc",
    "apps/habits-svc",
    "apps/content-svc",
    "apps/analytics-svc",
    "apps/games-svc",
    "apps/jobs-svc",
    "apps/digest-svc",
    "libs/polymath-core",
    "libs/polymath-db",
    "libs/polymath-events",
    "libs/polymath-llm",
    "libs/polymath-testing",
]

[tool.uv.sources]
polymath-core = { workspace = true }
polymath-db = { workspace = true }
polymath-events = { workspace = true }
polymath-llm = { workspace = true }
polymath-testing = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps", "libs"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
