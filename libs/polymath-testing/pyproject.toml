[project]
name = "polymath-testing"
version = "0.1.0"
description = "Shared test fixtures, factories, testcontainers helpers"
requires-python = ">=3.12"
dependencies = [
    "polymath-core",
    "polymath-db",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[postgres,redis]>=4.5",
    "factory-boy>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
