[project]
name = "polymath-llm"
version = "0.1.0"
description = "LLM client wrapper: LiteLLM routing, cost calculation, streaming helpers"
requires-python = ">=3.12"
dependencies = [
    "polymath-core",
    "litellm>=1.40",
    "anthropic>=0.27",
    "openai>=1.30",
    "pydantic>=2.7",
    "redis[asyncio]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
