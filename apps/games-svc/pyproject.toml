[project]
name = "games-svc"
version = "0.1.0"
description = "Polymath games service — leaderboards, game state"
requires-python = ">=3.12"
dependencies = [
    "polymath-core",
    "polymath-db",
    "polymath-events",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/games_svc"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
