[project]
name = "notes-svc"
version = "0.1.0"
description = "Polymath notes service — CRUD + pgvector semantic search"
requires-python = ">=3.12"
dependencies = [
    "polymath-core",
    "polymath-db",
    "polymath-events",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "prometheus-fastapi-instrumentator>=7.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
]

[tool.uv.sources]
polymath-core = { workspace = true }
polymath-db = { workspace = true }
polymath-events = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/notes_svc"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
