[project]
name = "llm-gateway"
version = "0.1.0"
description = "LLM Gateway: completions, prompt registry, cost tracking, evals"
requires-python = ">=3.12"
dependencies = [
    "polymath-core",
    "polymath-db",
    "polymath-llm",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis[asyncio]>=5.0",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "prometheus-fastapi-instrumentator>=7.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
